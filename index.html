<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for Ishita</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- CUTENESS OVERHAUL --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Soft animated gradient background */
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Nunito', sans-serif;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background bubbles for extra cuteness */
        .bg-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .bg-bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.3);
            bottom: -160px;
            border-radius: 50%;
            animation: bubbleFloat 25s infinite;
            transition-timing-function: linear;
        }
        .bg-bubbles li:nth-child(1) { left: 10%; }
        .bg-bubbles li:nth-child(2) { left: 20%; width: 80px; height: 80px; animation-delay: 2s; animation-duration: 17s; }
        .bg-bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-duration: 22s; background-color: rgba(255, 255, 255, 0.25); }
        .bg-bubbles li:nth-child(5) { left: 70%; }
        
        @keyframes bubbleFloat {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* --- MAIN CARD DESIGN --- */
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 10;
            max-width: 90%;
        }

        h1 {
            color: #ff4757;
            font-family: 'Fredoka', sans-serif; /* Cuter header font */
            font-size: 2.8rem;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .btn-group {
            position: relative;
            height: 120px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        button {
            padding: 15px 50px;
            font-size: 1.3rem;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        /* --- IMPROVED HEART TRANSITION --- */
        .yes-container {
            position: relative;
            width: 150px; /* Fixed width area for the button */
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #yes-btn {
            background-color: #ff6b81;
            color: white;
            z-index: 20;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy transition */
            overflow: visible;
        }
        
        /* The text inside the button */
        #yes-btn span {
            display: block;
            transition: opacity 0.2s ease;
        }

        /* When hovering the container, transform the button */
        .yes-container:hover #yes-btn {
            width: 60px;
            height: 60px;
            padding: 0;
            border-radius: 0; /* Become square temporarily */
            transform: rotate(45deg) scale(1.5); /* Rotate and enlarge */
            background-color: #ff4757;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }
        
        /* Hide text instantly on hover */
        .yes-container:hover #yes-btn span {
            opacity: 0;
        }

        /* The circles that form the top of the heart */
        #yes-btn::before,
        #yes-btn::after {
            content: "";
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #ff4757;
            border-radius: 50%;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.1s ease;
        }

        #yes-btn::before { top: -30px; left: 0; }
        #yes-btn::after { left: -30px; top: 0; }

        /* Show the circles only on hover */
        .yes-container:hover #yes-btn::before,
        .yes-container:hover #yes-btn::after {
            opacity: 1;
        }


        /* --- NO BUTTON STYLING --- */
        #no-btn {
            background-color: #a4b0be;
            color: white;
            position: absolute; /* Essential for moving around */
            right: 20px; /* Initial position */
            transition: all 0.3s ease;
        }

        /* Style for when it's moving fast */
        #no-btn.fast-move {
             transition: all 0.05s linear !important;
        }

        #hidden-message {
            margin-top: 60px;
            color: #ff4757;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            opacity: 0;
            transition: opacity 1s ease;
            height: 30px; /* Reserve space */
        }

    </style>
</head>
<body>

    <ul class="bg-bubbles">
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="container">
        <h1>Ishita, will you be my Valentine?</h1>
        
        <div class="btn-group">
            <div class="yes-container">
                <button id="yes-btn"><span>Yes!</span></button>
            </div>
            <button id="no-btn">No</button>
        </div>

        <p id="hidden-message">Oh, you really want to press no...</p>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const hiddenMessage = document.getElementById('hidden-message');
        
        let isHardMode = false;
        let zigzagInterval;
        
        // --- PHASE 1: THE SETUP ---
        // After 10 seconds, activate Hard Mode
        setTimeout(() => {
            isHardMode = true;
            hiddenMessage.style.opacity = '1'; // Show the text
            noBtn.classList.add('fast-move'); // Add CSS class for faster transition transitions
            startZigZag();
        }, 10000); // 10 seconds

        // --- PHASE 2: THE EVASION (Before 10s) ---
        document.addEventListener('mousemove', (e) => {
            // Only do the "move away on approach" if we are NOT in hard mode yet
            if (isHardMode) return;

            const x = e.clientX;
            const y = e.clientY;
            
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            // Calculate distance between cursor and button center
            const distance = Math.sqrt(
                Math.pow(x - btnCenterX, 2) + Math.pow(y - btnCenterY, 2)
            );

            // Trigger distance (e.g., 120px)
            if (distance < 120) {
                moveButtonAway();
            }
        });

        function moveButtonAway() {
            // Ensure button stays within viewable area
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const newX = Math.max(20, Math.random() * maxX);
            const newY = Math.max(20, Math.random() * maxY);

            noBtn.style.position = 'fixed'; 
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.right = 'auto'; // Clear initial CSS positioning
        }

        // --- PHASE 3: THE ZIG ZAG (Hard Mode) ---
        function startZigZag() {
            noBtn.style.position = 'fixed';
            
            // INCREASED MOVEMENT SPEED: 50ms interval (Very Fast)
            zigzagInterval = setInterval(() => {
                const maxX = window.innerWidth - noBtn.offsetWidth - 20;
                const maxY = window.innerHeight - noBtn.offsetHeight - 20;

                const randomX = Math.max(20, Math.random() * maxX);
                const randomY = Math.max(20, Math.random() * maxY);

                noBtn.style.left = randomX + 'px';
                noBtn.style.top = randomY + 'px';
            }, 50); // <-- Changed from 200 to 50 for extreme speed
        }

        // --- SUCCESS ---
        yesBtn.addEventListener('click', () => {
            // Make sure you have celebration.html referenced here
            window.location.href = "celebration.html"; 
        });

    </script>
</body>
</html>
